name: Deploy Myth Case

on:
  push:
    branches:
      - master
      - cursor/myth-weavers-viewer-3c20
    paths:
      - "MythWeaversViewer/web/**"
      - ".github/workflows/deploy-myth-case.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-myth-case
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: MythWeaversViewer/web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
